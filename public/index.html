<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161a22">
  <title>旅のしおり</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" hidden></div>
  <button id="fab" class="fab" hidden aria-label="行程を足す">＋</button>

  <dialog id="itemDialog">
    <form id="itemForm" method="dialog">
      <h2 id="itemDialogTitle">行程</h2>
      <label>名前<input name="title" required placeholder="例：あずさ83号 新宿 → 塩尻"></label>
      <div class="row">
        <label>日付<select name="date"></select></label>
        <label>種類<select name="type"></select></label>
      </div>
      <div class="row">
        <label>出発・開始<input name="time" type="time"></label>
        <label>到着・終了<input name="endTime" type="time"></label>
      </div>
      <div class="row">
        <label>金額（円）<input name="amount" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
        <label class="check"><input name="paid" type="checkbox"> 支払い済み</label>
      </div>
      <label>メモ・記録<textarea name="memo" rows="3" placeholder="気づいたこと、感想、実費など"></textarea></label>
      <label>写真
        <div class="photo-input-area" id="photoInputArea">
          <input type="file" name="photoFile" id="photoFile" accept="image/*" style="display:none">
          <div id="photoPreviewWrap"></div>
          <button type="button" class="ghost small" id="photoSelectBtn">📷 写真を選ぶ</button>
          <button type="button" class="ghost small danger" id="photoRemoveBtn" style="display:none">写真を削除</button>
        </div>
      </label>
      <label class="check skip"><input name="skipped" type="checkbox"> 行かなかった（合計から外して残す）</label>
      <div class="actions">
        <button type="button" class="danger" id="itemDelete">削除</button>
        <span class="spacer"></span>
        <button type="button" id="itemCancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="extraDialog">
    <form id="extraForm" method="dialog">
      <h2 id="extraDialogTitle">その他の旅費</h2>
      <label>名前<input name="title" required placeholder="例：1日目の夕食代、グリーン車"></label>
      <div class="row">
        <label>金額（円）<input name="amount" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
        <label class="check"><input name="paid" type="checkbox"> 支払い済み</label>
      </div>
      <label>メモ<input name="memo" placeholder="例：青鬼集落は店がないので松本で買っていく"></label>
      <div class="actions">
        <button type="button" class="danger" id="extraDelete">削除</button>
        <span class="spacer"></span>
        <button type="button" id="extraCancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="noteDialog">
    <form id="noteForm" method="dialog">
      <h2 id="noteDialogTitle">メモ・記録</h2>
      <label>内容<textarea name="body" rows="4" placeholder="気づいたこと、感想、ちょっとしたメモなど" required></textarea></label>
      <div class="row">
        <label>日付<select name="date"></select></label>
        <label>時刻（任意）<input name="time" type="time"></label>
      </div>
      <div class="actions">
        <button type="button" class="danger" id="noteDelete">削除</button>
        <span class="spacer"></span>
        <button type="button" id="noteCancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="spendDialog">
    <form id="spendForm" method="dialog">
      <h2>用途別支出を追加</h2>
      <label>用途<input name="category" required placeholder="例：おみやげ、食事、観光"></label>
      <label>金額（円）<input name="amount" type="number" inputmode="numeric" min="0" step="1" placeholder="0" required></label>
      <label>メモ（任意）<input name="memo" placeholder="例：松本の駅ビルで"></label>
      <div class="actions">
        <button type="button" class="danger" id="spendDelete">削除</button>
        <span class="spacer"></span>
        <button type="button" id="spendCancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="logDialog">
    <form id="logForm" method="dialog">
      <h2 id="logDialogTitle">記録を残す</h2>
      <label>内容<textarea name="body" rows="4" placeholder="見たもの、感じたこと、ちょっとしたメモ" required></textarea></label>
      <label>写真（任意）
        <div class="photo-input-area" id="logPhotoInputArea">
          <input type="file" name="logPhotoFile" id="logPhotoFile" accept="image/*" style="display:none">
          <div id="logPhotoPreviewWrap"></div>
          <button type="button" class="ghost small" id="logPhotoSelectBtn">📷 写真を選ぶ</button>
          <button type="button" class="ghost small danger" id="logPhotoRemoveBtn" style="display:none">写真を削除</button>
        </div>
      </label>
      <label>時刻<input name="time" type="time"></label>
      <div class="actions">
        <button type="button" class="danger" id="logDelete">削除</button>
        <span class="spacer"></span>
        <button type="button" id="logCancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="tripDialog">
    <form id="tripForm" method="dialog">
      <h2 id="tripDialogTitle">旅</h2>
      <label>旅の名前<input name="name" required placeholder="例：奈良井宿と青鬼集落の旅"></label>
      <div class="row">
        <label>出発日<input name="start" type="date" required></label>
        <label>帰着日<input name="end" type="date" required></label>
      </div>
      <label>メモ<textarea name="memo" rows="3" placeholder="持ち物、注意点など"></textarea></label>
      <div class="actions">
        <button type="button" class="danger" id="tripDelete">この旅を削除</button>
        <span class="spacer"></span>
        <button type="button" id="tripCancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
